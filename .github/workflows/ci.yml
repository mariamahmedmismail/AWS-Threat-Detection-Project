name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !node_modules

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for AWS keys and private keys
        run: |
          if grep -rEn --exclude-dir=.git --exclude-dir=node_modules \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'ASIA[0-9A-Z]{16}' \
            -e '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' . ; then
            echo "Possible secret found. Remove it and rotate the credential."
            exit 1
          fi
          echo "No secrets found."
